syntax = "proto3";
package inventory;
import "google/protobuf/field_mask.proto";

message OrderItem {
  optional uint64 time_label = 1;

  uint32 batch_offset = 2;
  uint32 order_id = 3;
  uint32 product_id = 4;
  uint32 quantity = 5;

  google.protobuf.FieldMask update_mask = 6;
}

message InsertRequest {
  repeated OrderItem entities = 1;
}

message InsertResponse {
  string result = 1;
}

service OrderItemService {
  rpc Insert(InsertRequest) returns (stream InsertResponse) {}
}
